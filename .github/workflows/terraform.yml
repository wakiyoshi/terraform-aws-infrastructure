name: Terraform CI / Apply

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Applyする環境
        required: true
        type: choice
        options:
          - DEV
          - STG
          - PROD

# OIDCトークンの発行とリポジトリの読み取りだけを許可する
permissions:
  contents: read
  id-token: write

# 手動applyは環境を問わず直列化し、同時applyを防止する
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'terraform-apply' || format('terraform-ci-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  # 手動実行で選択した環境からapply先を決定する
  TF_WORKING_DIR: ${{ fromJSON('{"DEV":"environments/dev","STG":"environments/stg","PROD":"environments/prod"}')[inputs.environment] }}
  AWS_ROLE_ARN: ${{ vars[format('AWS_ROLE_ARN_{0}', inputs.environment)] }}
  AWS_ACCOUNT_ID: ${{ vars[format('AWS_ACCOUNT_ID_{0}', inputs.environment)] }}

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    name: Terraform plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: DEV
            working_directory: environments/dev
            role_variable: AWS_ROLE_ARN_DEV
            account_variable: AWS_ACCOUNT_ID_DEV
          - environment: STG
            working_directory: environments/stg
            role_variable: AWS_ROLE_ARN_STG
            account_variable: AWS_ACCOUNT_ID_STG
          - environment: PROD
            working_directory: environments/prod
            role_variable: AWS_ROLE_ARN_PROD
            account_variable: AWS_ACCOUNT_ID_PROD

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Terraformをセットアップ
        uses: hashicorp/setup-terraform@v4
        with:
          # ローカルで使用中かつrequired_versionを満たすバージョンに固定する
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Terraform fmtを確認
        run: terraform fmt -check -recursive

      - name: AWSへOIDC認証
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Repository Variablesに環境別Role ARNとAccount IDを設定する
          role-to-assume: ${{ vars[matrix.role_variable] }}
          role-session-name: terraform-plan-${{ matrix.environment }}-${{ github.run_id }}
          aws-region: ap-northeast-1
          allowed-account-ids: ${{ vars[matrix.account_variable] }}

      - name: Terraform init
        run: terraform -chdir="${{ matrix.working_directory }}" init -lockfile=readonly

      - name: Terraform validate
        run: terraform -chdir="${{ matrix.working_directory }}" validate

      - name: Terraform plan
        run: terraform -chdir="${{ matrix.working_directory }}" plan -no-color -out=tfplan

      - name: plan結果をJob Summaryへ出力
        run: |
          {
            echo "## Terraform plan (${{ matrix.environment }})"
            echo '```hcl'
            terraform -chdir="${{ matrix.working_directory }}" show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply_plan:
    if: github.event_name == 'workflow_dispatch'
    name: Apply plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 必須Repository Variablesを確認
        run: |
          if [[ -z "$AWS_ROLE_ARN" || ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "選択環境のRole ARNまたは12桁のAccount IDが未設定です。" >&2
            exit 1
          fi

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Terraformをセットアップ
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: AWSへOIDC認証
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: terraform-apply-plan-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ap-northeast-1
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Terraform init
        run: terraform -chdir="$TF_WORKING_DIR" init -lockfile=readonly

      - name: Terraform plan
        run: terraform -chdir="$TF_WORKING_DIR" plan -no-color -out=tfplan

      - name: apply予定のplanをJob Summaryへ出力
        run: |
          {
            echo "## Terraform apply plan (${{ inputs.environment }})"
            echo '```hcl'
            terraform -chdir="$TF_WORKING_DIR" show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: planファイルを保存
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    if: github.event_name == 'workflow_dispatch'
    name: Terraform apply (${{ inputs.environment }})
    needs: apply_plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # STG / PRODにはGitHub EnvironmentのRequired reviewersを設定する
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Terraformをセットアップ
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: AWSへOIDC認証
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: terraform-apply-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ap-northeast-1
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      # 新しいrunnerで保存済みplanを適用するため、同じbackend/providerを初期化する
      - name: Terraform init
        run: terraform -chdir="$TF_WORKING_DIR" init -lockfile=readonly

      - name: 承認済みplanを取得
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        run: terraform -chdir="$TF_WORKING_DIR" apply -auto-approve tfplan
