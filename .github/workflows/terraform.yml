name: Terraform CI / Apply

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "modules/network/cloudfront/*.js"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
      - ".github/actions/terraform-setup/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Applyする環境
        required: true
        type: choice
        options:
          - DEV
          - STG
          - PROD

# OIDCトークンの発行とリポジトリの読み取りだけを許可する
permissions:
  contents: read
  id-token: write

# 同じ環境への手動applyを直列化する
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('terraform-apply-{0}', inputs.environment) || format('terraform-ci-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  # 手動実行で選択した環境からapply先を決定する
  TF_WORKING_DIR: ${{ fromJSON('{"DEV":"environments/dev","STG":"environments/stg","PROD":"environments/prod"}')[inputs.environment] }}
  AWS_ROLE_ARN: ${{ vars[format('AWS_ROLE_ARN_{0}', inputs.environment)] }}
  AWS_ACCOUNT_ID: ${{ vars[format('AWS_ACCOUNT_ID_{0}', inputs.environment)] }}

jobs:
  cloudfront-function-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: CloudFront Functionの認証とパス処理を検証
        run: node tests/cloudfront-basic-auth.cjs

  targets:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.targets.outputs.environments }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 手動applyはマージ後のmainから実行
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "mainブランチを選択して実行してください。" >&2
          exit 1
      - id: targets
        name: 対象環境を決定
        env:
          SELECTED_ENV: ${{ inputs.environment }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path

          if os.environ["SELECTED_ENV"]:
              targets = [os.environ["SELECTED_ENV"]]
          else:
              paths = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z",
                  os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]
              ]).decode().split("\0")
              shared = any(p.startswith(("modules/", ".github/actions/terraform-setup/"))
                           or p == ".github/workflows/terraform.yml"
                           or (p and "/" not in p and (p.endswith((".tf", ".tfvars")) or p == ".terraform.lock.hcl"))
                           for p in paths)
              targets = [env.upper() for env in ("dev", "stg", "prod")
                         if shared or any(p.startswith(f"environments/{env}/") for p in paths)]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("environments=" + json.dumps(targets) + "\n")
          PYTHON

  plan:
    needs: targets
    if: >-
      needs.targets.outputs.environments != '[]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Terraform plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.targets.outputs.environments) }}
    env:
      TF_WORKING_DIR: ${{ fromJSON('{"DEV":"environments/dev","STG":"environments/stg","PROD":"environments/prod"}')[matrix.environment] }}
    steps:
      - uses: actions/checkout@v7
      - name: Terraform・AWSをセットアップ
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars[format(github.event_name == 'pull_request' && 'AWS_PLAN_ROLE_ARN_{0}' || 'AWS_ROLE_ARN_{0}', matrix.environment)] }}
          account-id: ${{ vars[format('AWS_ACCOUNT_ID_{0}', matrix.environment)] }}
          working-directory: ${{ env.TF_WORKING_DIR }}
      - name: Terraform fmtを確認
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: terraform -chdir="$TF_WORKING_DIR" validate
      - name: Terraform plan
        run: terraform -chdir="$TF_WORKING_DIR" plan -no-color -out=tfplan
      - name: plan結果をJob Summaryへ出力
        run: |
          {
            echo "## Terraform plan (${{ matrix.environment }})"
            echo '```hcl'
            terraform -chdir="$TF_WORKING_DIR" show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: apply用planを保存
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    if: github.event_name == 'workflow_dispatch'
    name: Terraform apply (${{ inputs.environment }})
    needs: [plan, cloudfront-function-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # STG / PRODにはGitHub EnvironmentのRequired reviewersを設定する
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Terraform・AWSをセットアップ
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ env.AWS_ROLE_ARN }}
          account-id: ${{ env.AWS_ACCOUNT_ID }}
          working-directory: ${{ env.TF_WORKING_DIR }}

      - name: 承認済みplanを取得
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        run: terraform -chdir="$TF_WORKING_DIR" apply -auto-approve tfplan
