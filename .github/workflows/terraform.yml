name: Terraform CI / Apply

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "modules/cloudfront/*.js"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform.yml"
      - ".github/actions/terraform-setup/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Plan・Applyする環境
        required: true
        type: choice
        options:
          - DEV
          - STG
          - PROD

# 共通権限は読み取りのみ。OIDCはPlan・Apply Jobで許可する
permissions:
  contents: read

# 同じ環境への手動applyを直列化する
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('terraform-apply-{0}', inputs.environment) || format('terraform-ci-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  # 手動実行で選択した環境からapply先を決定する
  TF_WORKING_DIR: ${{ fromJSON('{"DEV":"environments/dev","STG":"environments/stg","PROD":"environments/prod"}')[inputs.environment] }}
  AWS_ROLE_ARN: ${{ vars[format('AWS_ROLE_ARN_{0}', inputs.environment)] }}
  AWS_ACCOUNT_ID: ${{ vars[format('AWS_ACCOUNT_ID_{0}', inputs.environment)] }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Terraformをセットアップ（AWS認証なし）
        uses: ./.github/actions/terraform-setup
        with:
          backend: 'false'
      - name: Terraform fmtを確認
        run: terraform fmt -check -recursive
      - name: 各環境のTerraform validate
        run: |
          for environment in dev stg prod; do
            terraform -chdir="environments/$environment" init -backend=false -lockfile=readonly
            terraform -chdir="environments/$environment" validate -no-color
          done
      - name: CloudFront FunctionのJS変更を確認
        id: cloudfront
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- 'modules/cloudfront/*.js'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: CloudFront Functionの認証とパス処理を検証
        if: steps.cloudfront.outputs.changed == 'true'
        run: node --test tests/cloudfront-basic-auth.cjs

  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Terraform plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Terraform・AWSをセットアップ
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ env.AWS_ROLE_ARN }}
          account-id: ${{ env.AWS_ACCOUNT_ID }}
          working-directory: ${{ env.TF_WORKING_DIR }}
      - name: Terraform plan
        run: terraform -chdir="$TF_WORKING_DIR" plan -no-color -out=tfplan
      - name: plan結果をJob Summaryへ出力
        run: |
          {
            echo "## Terraform plan (${{ inputs.environment }})"
            echo '```hcl'
            terraform -chdir="$TF_WORKING_DIR" show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: apply用planを保存
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Terraform apply (${{ inputs.environment }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # DEV / STG / PRODすべてにRequired reviewersを設定する
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Terraform・AWSをセットアップ
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ env.AWS_ROLE_ARN }}
          account-id: ${{ env.AWS_ACCOUNT_ID }}
          working-directory: ${{ env.TF_WORKING_DIR }}

      - name: 承認済みplanを取得
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        run: terraform -chdir="$TF_WORKING_DIR" apply -auto-approve tfplan
