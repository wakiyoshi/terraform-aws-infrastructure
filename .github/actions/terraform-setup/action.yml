name: Terraform setup
description: TerraformとAWS認証、backendの共通セットアップ
inputs:
  role-arn:
    required: false
    description: AWS IAM Role ARN
  account-id:
    required: false
    description: AWS Account ID
  working-directory:
    required: false
    description: Terraform working directory
  backend:
    description: AWS認証とbackend初期化を実行するか
    default: 'true'
runs:
  using: composite
  steps:
    - name: AWS設定を確認
      if: inputs.backend == 'true'
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
        ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        if [[ -z "$ROLE_ARN" || ! "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
          echo "対象環境のRole ARNまたは12桁のAccount IDが未設定です。" >&2
          exit 1
        fi
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.15.7
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@v6
      if: inputs.backend == 'true'
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: terraform-${{ github.run_id }}
        aws-region: ap-northeast-1
        allowed-account-ids: ${{ inputs.account-id }}
    - if: inputs.backend == 'true'
      shell: bash
      env:
        TF_WORKING_DIR: ${{ inputs.working-directory }}
      run: terraform -chdir="$TF_WORKING_DIR" init -lockfile=readonly
